# EC2: set PUBLIC_HOST to your instance public IP or domain, then from repo root:
#   docker compose -f deploy/ec2/docker-compose.prod.yml up -d --build
#
# Required: server/.env with MONGODB_URI (or MONGO_URI) and JWT_SECRET

services:
  api:
    build:
      context: ../../server
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - ../../server/.env
    environment:
      NODE_ENV: production
      PORT: 5000
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost,http://localhost:80}
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

  web:
    build:
      context: ../../client/my-app
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ${PUBLIC_API_URL:-http://localhost:5000}
        REACT_APP_SOCKET_URL: ${PUBLIC_SOCKET_URL:-http://localhost:5000}
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    restart: always
