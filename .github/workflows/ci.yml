name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/my-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/my-app/package-lock.json
      - run: npm ci
      - run: npm run test:ci

  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
        env:
          JWT_SECRET: ci-test-secret
          MONGODB_URI: ${{ secrets.MONGODB_URI_TEST }}

  docker-build:
    runs-on: ubuntu-latest
    needs: [frontend-test, backend-test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: false
          tags: taskmanager-api:latest
      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: ./client/my-app
          push: false
          tags: taskmanager-web:latest
          build-args: |
            REACT_APP_API_URL=https://api.example.com
            REACT_APP_SOCKET_URL=https://api.example.com
